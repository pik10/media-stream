services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: media-stream-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      # Persist database - mount data directory instead of file
      - ./data:/app/data
      # Database will be at /app/data/database.sqlite
    # No ports exposed to host
    networks:
      - proxy    # For Caddy access
      - default  # For frontend-backend communication
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: media-stream-frontend
    restart: unless-stopped
    # No ports exposed to host
    depends_on:
      - backend
    networks:
      - proxy    # For Caddy access
      - default  # For frontend-backend communication

networks:
  proxy:
    external: true
  default:
    driver: bridge
